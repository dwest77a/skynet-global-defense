# Key step inputs inside .github/workflows/gemini-issue-fix.yml
name: Gemini Issue fix

on: [push]
  # issues:
  #   types: [opened]
  #workflow_run

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  gemini-fix:
    environment: Net_v1
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud (Service Account Key)
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Run Gemini Agent on Vertex AI
      uses: google-github-actions/run-gemini-cli@v0
      env:
        GOOGLE_GENAI_USE_VERTEXAI: "true"
        GOOGLE_CLOUD_PROJECT: "prj-d-ral-vtxai-kwr9"
        GOOGLE_CLOUD_LOCATION: "europe-west2"
        GH_TOKEN: ${{ secrets.REPO_PR_PAT }} # Fine-grained PAT or GitHub App token
        GEMINI_CLI_TRUST_WORKSPACE: true
      with:
        gemini_model: "gemini-2.5-pro"
        use_vertex_ai: true
        gcp_project_id: "prj-d-ral-vtxai-kwr9"
        gcp_location: "europe-west2"
        prompt: "Add a src/skynet/__init__.py initialisation file to the checked out repo, following GEMINI.md and AGENTS.md and submit a pull request"
        # prompt: |
        #   Resolve GitHub Issue #${{ github.event.issue.number }} following GEMINI.md and AGENTS.md:
        #   Title: ${{ github.event.issue.title }}
        #   Body: ${{ github.event.issue.body }}